<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EU-rätt – kursmaterial</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f4f4f2;
    color: #1d1d1f;
    font: 17px/1.5 "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 64px; }
  h1 { margin: 0 0 4px; font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 0 0 36px; color: #5b5b60; }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 14px; }
  a.doc {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 20px; min-height: 76px;
    background: #fff; border: 1px solid #dcdcd8; border-radius: 10px;
    color: inherit; text-decoration: none;
  }
  a.doc:hover, a.doc:focus-visible { border-color: #8a8a86; outline: none; }
  .ico {
    flex: none; width: 40px; height: 48px; border-radius: 4px;
    background: #b3261e; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px;
  }
  .name { display: block; font-weight: 600; }
  .meta { display: block; color: #5b5b60; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>EU-rätt</h1>
  <p class="sub">Föreläsning 7 · material till seminariet</p>
  <ul>
    <li>
      <a class="doc" href="rattsfall.pdf">
        <span class="ico">PDF</span>
        <span><span class="name">Rättsfall – översikt</span><span class="meta">EU-rättens genomslag i nationell rätt · 5 sidor</span></span>
      </a>
    </li>
    <li>
      <a class="doc" href="domar.pdf">
        <span class="ico">PDF</span>
        <span><span class="name">Domar</span><span class="meta">Van Gend en Loos · Costa mot ENEL · Åkerberg Fransson · 31 sidor</span></span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
